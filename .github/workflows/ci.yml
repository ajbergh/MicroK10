name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt

      - name: Bash syntax
        run: bash -n microk10 lib/*.sh tests/*.sh *.sh

      - name: ShellCheck
        run: shellcheck microk10 lib/*.sh tests/*.sh *.sh

      - name: Formatting
        run: shfmt -d -i 2 microk10 lib/*.sh tests/*.sh *.sh

      - name: Unit tests
        run: bash tests/unit.sh

      - name: Lifecycle dry run
        run: bash tests/dry-run.sh

      - name: Plaintext credential scan
        run: bash tests/no-plaintext-secrets.sh
