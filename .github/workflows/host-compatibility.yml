name: Rocky host compatibility matrix

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microk10-rocky-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rocky: "9.8"
          - runner: ubuntu-24.04
            rocky: "10.2"
          - runner: ubuntu-24.04-arm
            rocky: "9.8"
          - runner: ubuntu-24.04-arm
            rocky: "10.2"
    runs-on: ${{ matrix.runner }}
    container:
      image: rockylinux/rockylinux:${{ matrix.rocky }}
    steps:
      - name: Install test prerequisites
        shell: bash
        run: dnf install -y git grep sed gawk findutils

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Rocky compatibility logic
        shell: bash
        run: |
          source /etc/os-release
          test "${VERSION_ID}" = "${{ matrix.rocky }}"
          bash -n microk10 lib/*.sh tests/*.sh *.sh appliance/microk10-tui appliance/lib/*.sh appliance/packer/scripts/*.sh
          bash tests/unit.sh
          bash tests/no-plaintext-secrets.sh
          ./microk10 compatibility
          ./microk10 compatibility | grep -q "${{ matrix.rocky }}"
