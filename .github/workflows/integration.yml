name: Rocky MicroK8s and Kasten integration matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: read

concurrency:
  group: microk10-rocky-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    # Live MicroK8s integration requires a VM/bare-metal Rocky runner with
    # systemd, snapd and sufficient privileges. Container jobs cannot validate
    # this layer authoritatively.
    runs-on: [self-hosted, Linux, X64, rocky, microk10-integration]
    strategy:
      fail-fast: false
      matrix:
        kubernetes:
          - "1.31"
          - "1.32"
          - "1.33"
          - "1.34"
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm Rocky integration host
        shell: bash
        run: |
          source /etc/os-release
          test "${ID}" = rocky
          echo "Testing on ${PRETTY_NAME}"
          ./microk10 compatibility

      - name: Reset prior lab state
        shell: bash
        run: |
          sudo ./microk10 uninstall --yes --purge-microk8s --allow-unsupported || true
          sudo systemctl disable --now microk10-minio.service 2>/dev/null || true
          sudo podman rm -f microk10-minio 2>/dev/null || true
          sudo rm -rf /var/lib/microk10/minio /etc/microk10/minio.env

      - name: Install selected MicroK8s release
        shell: bash
        run: |
          sudo ./microk10 install-microk8s \
            --microk8s-channel ${{ matrix.kubernetes }}/stable \
            --timeout 25m

      - name: Install and validate Veeam Kasten
        shell: bash
        run: |
          sudo ./microk10 install-kasten \
            --microk8s-channel ${{ matrix.kubernetes }}/stable \
            --kasten-version 9.0.1 \
            --timeout 35m
          sudo ./microk10 validate \
            --microk8s-channel ${{ matrix.kubernetes }}/stable \
            --kasten-version 9.0.1 \
            --timeout 20m

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          sudo ./microk10 status --allow-unsupported || true
          sudo microk8s inspect || true
          sudo microk8s kubectl get nodes,storageclass,pods --all-namespaces -o wide || true
