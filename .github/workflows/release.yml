name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          configured="$(sed -n 's/^MICROK10_RELEASE_VERSION="\(.*\)"/\1/p' config/compatibility.env)"
          test "${version}" = "${configured}"

      - name: Build release archive
        run: |
          mkdir -p dist staging/MicroK10
          cp -R \
            microk10 *.sh config docs lib manifests tests \
            .editorconfig .shellcheckrc .gitignore \
            CHANGELOG.md CONTRIBUTING.md LICENSE Makefile README.md SECURITY.md \
            staging/MicroK10/
          tar -C staging -czf "dist/MicroK10-${GITHUB_REF_NAME}.tar.gz" MicroK10
          sha256sum dist/* > "dist/MicroK10-${GITHUB_REF_NAME}-SHA256SUMS.txt"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --generate-notes \
            --title "MicroK10 ${GITHUB_REF_NAME}"
