apiVersion: v1
kind: Namespace
metadata:
  name: microk10-demo
  labels:
    app.kubernetes.io/name: microk10-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-data
  namespace: microk10-demo
  labels:
    app.kubernetes.io/name: microk10-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: __STORAGE_CLASS__
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microk10-demo
  namespace: microk10-demo
  labels:
    app.kubernetes.io/name: microk10-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: microk10-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: microk10-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              test -f /data/created-at || date -u +%Y-%m-%dT%H:%M:%SZ > /data/created-at
              while true; do
                date -u +%Y-%m-%dT%H:%M:%SZ >> /data/activity.log
                sleep 60
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: demo-data
